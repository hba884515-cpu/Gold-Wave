<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" width="100%" height="100%">
  <defs>
    <!-- Silver Metallic Gradients -->
    <linearGradient id="silverTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#e2e8f0"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="silverFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="25%" stop-color="#cbd5e1"/>
      <stop offset="70%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="silverSide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="silverGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0"/>
    </linearGradient>
    <filter id="silverDropShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#94a3b8" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Ambient Shadow & Cold Platinum Glow -->
  <ellipse cx="100" cy="135" rx="75" ry="18" fill="rgba(0,0,0,0.55)" filter="blur(6px)"/>
  <ellipse cx="100" cy="90" rx="60" ry="30" fill="url(#silverGlow)" opacity="0.35" filter="blur(14px)"/>

  <!-- 3D Silver Ingot Isometric -->
  <g filter="url(#silverDropShadow)">
    <!-- Front Face -->
    <polygon points="35,75 145,75 130,125 20,125" fill="url(#silverFront)"/>

    <!-- Right Side Face -->
    <polygon points="145,75 180,50 165,100 130,125" fill="url(#silverSide)"/>

    <!-- Top Beveled Face -->
    <polygon points="50,45 160,45 180,50 145,75 35,75" fill="url(#silverTop)"/>

    <!-- Chamfer Edge Highlights (Crisp Chrome Shine) -->
    <polyline points="50,45 160,45 180,50" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.95"/>
    <line x1="35" y1="75" x2="145" y2="75" stroke="#ffffff" stroke-width="2.5" opacity="0.98"/>
    <line x1="35" y1="75" x2="20" y2="125" stroke="#f1f5f9" stroke-width="1.5" opacity="0.8"/>
    <line x1="145" y1="75" x2="130" y2="125" stroke="#475569" stroke-width="1.5"/>

    <!-- Stamped Hallmark Details -->
    <g transform="translate(42, 85) rotate(-3)" opacity="0.85">
      <rect x="0" y="0" width="80" height="24" rx="4" fill="none" stroke="#1e293b" stroke-width="1"/>
      <text x="40" y="11" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" font-weight="900" fill="#1e293b" text-anchor="middle" letter-spacing="1">999.0 FINE SILVER</text>
      <text x="40" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="7" font-weight="800" fill="#334155" text-anchor="middle">1000g • BULLION AG</text>
    </g>

    <!-- Specular Light Reflection Streak -->
    <polygon points="40,75 70,75 55,125 25,125" fill="#ffffff" opacity="0.25"/>
    <polygon points="85,75 95,75 85,125 75,125" fill="#ffffff" opacity="0.15"/>
    <circle cx="140" cy="53" r="2.5" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>
