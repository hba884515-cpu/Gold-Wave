<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" width="100%" height="100%">
  <defs>
    <!-- Bitcoin Gradient Styles -->
    <linearGradient id="btcCylinder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="btcFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="20%" stop-color="#fb923c"/>
      <stop offset="60%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="btcInnerRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
    <linearGradient id="btcGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </linearGradient>
    <filter id="btcDropShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#f97316" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Ground Shadow & Ambient Aura -->
  <ellipse cx="100" cy="138" rx="65" ry="16" fill="rgba(0,0,0,0.6)" filter="blur(6px)"/>
  <ellipse cx="100" cy="80" rx="60" ry="40" fill="url(#btcGlow)" opacity="0.35" filter="blur(16px)"/>

  <!-- 3D Coin Body (Tilted 3D Isometric View) -->
  <g filter="url(#btcDropShadow)">
    <!-- Coin Thickness (Cylinder Edge) -->
    <path d="M 40,80 A 60 40 0 0 0 160,80 L 160,98 A 60 40 0 0 1 40,98 Z" fill="url(#btcCylinder)"/>
    
    <!-- Coin Edge Ribs / Ridges -->
    <path d="M 45,86 L 45,95 M 60,95 L 60,103 M 80,100 L 80,108 M 100,102 L 100,110 M 120,100 L 120,108 M 140,95 L 140,103 M 155,86 L 155,95" stroke="#fef3c7" stroke-width="1.5" opacity="0.5"/>

    <!-- Coin Top Elliptical Face -->
    <ellipse cx="100" cy="80" rx="60" ry="40" fill="url(#btcFace)" stroke="#fff7ed" stroke-width="2"/>

    <!-- Inner Decorative Ring -->
    <ellipse cx="100" cy="80" rx="50" ry="33" fill="none" stroke="url(#btcInnerRing)" stroke-width="3" stroke-dasharray="4,2"/>

    <!-- Satoshi 'B' Emblem (Beveled & Embossed) -->
    <g transform="translate(80, 52) scale(1, 0.72) rotate(12 20 30)">
      <!-- Drop Shadow of Symbol -->
      <path d="M 14,8 L 26,8 C 32,8 36,11 36,16 C 36,19 34,22 30,23 C 35,24 38,28 38,34 C 38,40 33,44 26,44 L 14,44 Z M 18,14 L 18,22 L 25,22 C 28,22 30,20 30,18 C 30,16 28,14 25,14 Z M 18,28 L 18,38 L 26,38 C 29,38 32,36 32,33 C 32,30 29,28 26,28 Z" fill="#7c2d12" transform="translate(1, 2)"/>
      
      <!-- Top Face of Symbol -->
      <path d="M 14,8 L 26,8 C 32,8 36,11 36,16 C 36,19 34,22 30,23 C 35,24 38,28 38,34 C 38,40 33,44 26,44 L 14,44 Z M 18,14 L 18,22 L 25,22 C 28,22 30,20 30,18 C 30,16 28,14 25,14 Z M 18,28 L 18,38 L 26,38 C 29,38 32,36 32,33 C 32,30 29,28 26,28 Z" fill="#ffffff"/>
      
      <!-- Top & Bottom Prongs -->
      <line x1="20" y1="3" x2="20" y2="9" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
      <line x1="26" y1="3" x2="26" y2="9" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
      <line x1="20" y1="43" x2="20" y2="49" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
      <line x1="26" y1="43" x2="26" y2="49" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Specular Light Reflection -->
    <path d="M 50,65 A 55 35 0 0 1 150,65 A 50 30 0 0 0 50,65 Z" fill="#ffffff" opacity="0.3"/>
  </g>
</svg>
